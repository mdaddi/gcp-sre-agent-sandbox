# =============================================================================
# SCENARIO: Pending Pods - Insufficient Resources
# =============================================================================
# Pods request more resources than available, staying in Pending state.
#
# HOW TO BREAK: kubectl apply -f k8s/scenarios/pending-pods.yaml
# HOW TO FIX:   kubectl delete deployment resource-hog -n pets
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-hog
  namespace: pets
  labels:
    app: resource-hog
    scenario: pending-pods
    sre-demo: breakable
spec:
  replicas: 5
  selector:
    matchLabels:
      app: resource-hog
  template:
    metadata:
      labels:
        app: resource-hog
        scenario: pending-pods
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: resource-hog
          image: nginx:alpine
          resources:
            requests:
              memory: "32Gi"
              cpu: "8"
            limits:
              memory: "64Gi"
              cpu: "16"
