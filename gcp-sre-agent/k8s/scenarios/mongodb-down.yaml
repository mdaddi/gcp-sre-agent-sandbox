# =============================================================================
# SCENARIO: MongoDB Down - Cascading Dependency Failure
# =============================================================================
# MongoDB scaled to 0 replicas, causing makeline-service health check failures.
# Orders queue in RabbitMQ but are never fulfilled.
#
# HOW TO BREAK: kubectl apply -f k8s/scenarios/mongodb-down.yaml
# HOW TO FIX:   kubectl apply -f k8s/base/application.yaml
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: cloudops
  labels:
    app: mongodb
    scenario: mongodb-down
    sre-demo: breakable
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        scenario: mongodb-down
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: mongodb
          image: mongo:4.4
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: mongodb-data-pvc
