# =============================================================================
# SCENARIO: Network Policy Blocking - Service Connectivity Issues
# =============================================================================
# NetworkPolicy blocks all traffic to order-service.
#
# HOW TO BREAK: kubectl apply -f k8s/scenarios/network-block.yaml
# HOW TO FIX:   kubectl delete networkpolicy deny-order-service -n cloudops
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-order-service
  namespace: cloudops
  labels:
    scenario: network-block
    sre-demo: breakable
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
