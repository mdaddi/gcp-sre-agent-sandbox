# =============================================================================
# SCENARIO: OOMKilled - Out of Memory Crash
# =============================================================================
# order-service runs out of memory and crashes repeatedly.
#
# HOW TO BREAK: kubectl apply -f k8s/scenarios/oom-killed.yaml
# HOW TO FIX:   kubectl apply -f k8s/base/application.yaml
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: pets
  labels:
    app: order-service
    scenario: oom-killed
    sre-demo: breakable
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: order-service
          image: ghcr.io/gcp-sre-agent/store-demo/order-service:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "8Mi"
              cpu: "100m"
            limits:
              memory: "16Mi"
              cpu: "200m"
          env:
            - name: ORDER_QUEUE_HOSTNAME
              value: "rabbitmq"
            - name: ORDER_QUEUE_PORT
              value: "5672"
            - name: ORDER_QUEUE_USERNAME
              value: "guest"
            - name: ORDER_QUEUE_PASSWORD
              value: "guest"
            - name: ORDER_QUEUE_NAME
              value: "orders"
            - name: FASTIFY_ADDRESS
              value: "0.0.0.0"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=64"
