---
# Google Managed Prometheus - PodMonitoring CRDs
# Enables automatic metrics scraping for application services

apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: order-service
  namespace: cloudops
spec:
  selector:
    matchLabels:
      app: order-service
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics

